<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MakerManager</title>
  <link rel="stylesheet" href="/css/styles.css">
  <link rel="icon" href="/favicon.png">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#6c63ff">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="MakerManager">
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="sidebar-logo">
        <img src="/favicon.png" class="logo-icon" style="width:24px;height:24px;object-fit:contain;vertical-align:middle" onerror="this.outerHTML='<span class=\'logo-icon\'>⬡</span>'">
        <span class="logo-text">MakerManager</span>
      </div>
      <nav class="sidebar-nav">
        <a href="#dashboard" class="nav-item active" data-page="dashboard">
          <span class="nav-icon">📊</span>
          <span>Dashboard</span>
        </a>
        <a href="#jobs" class="nav-item" data-page="jobs">
          <span class="nav-icon">📋</span>
          <span>Trabajos</span>
        </a>
        <a href="#clients" class="nav-item" data-page="clients">
          <span class="nav-icon">👥</span>
          <span>Clientes</span>
        </a>
        <a href="#inventory" class="nav-item" data-page="inventory">
          <span class="nav-icon">📦</span>
          <span>Inventario</span>
        </a>
        <a href="#printers" class="nav-item" data-page="printers">
          <span class="nav-icon">🖨️</span>
          <span>Impresoras</span>
        </a>
        <a href="#config" class="nav-item" data-page="config" data-admin-only>
          <span class="nav-icon">⚙️</span>
          <span>Configuración</span>
        </a>
      </nav>
      <div class="sidebar-footer">
        <div id="sidebar-user" style="margin-bottom:10px;padding:8px;background:var(--surface);border-radius:8px;border:1px solid var(--border);min-height:36px"></div>
        <button onclick="logout()" class="btn btn-secondary btn-sm" style="width:100%;margin-top:4px">🚪 Cerrar sesión</button>
        <div style="margin-top:8px;font-size:10px;color:var(--text-muted);text-align:center">v2.0.0 <span style="opacity:0.5">· by Cerberus Dev</span></div>
      </div>
    </aside>
    <main class="content">
      <div id="page-dashboard" class="page"></div>
      <div id="page-inventory" class="page hidden"></div>
      <div id="page-printers" class="page hidden"></div>
      <div id="page-clients" class="page hidden"></div>
      <div id="page-jobs" class="page hidden"></div>
      <div id="page-config" class="page hidden"></div>
    </main>
  </div>

  <!-- Modal -->
  <div id="modal-overlay" class="modal-overlay hidden">
    <div class="modal" id="modal-box">
      <div class="modal-header">
        <h3 id="modal-title">Modal</h3>
        <button class="modal-close" onclick="closeModal()">✕</button>
      </div>
      <div id="modal-body" class="modal-body"></div>
    </div>
  </div>

  <!-- Confirm Modal -->
  <div id="confirm-overlay" class="modal-overlay hidden">
    <div class="modal confirm-modal" id="confirm-box">
      <div class="modal-header">
        <h3 id="confirm-title">Confirmar</h3>
        <button class="modal-close" onclick="closeConfirm()">✕</button>
      </div>
      <div class="modal-body">
        <div class="confirm-icon" id="confirm-icon">⚠️</div>
        <div class="confirm-msg" id="confirm-msg"></div>
        <div class="confirm-btns">
          <button class="btn btn-secondary" onclick="closeConfirm()">✗ No</button>
          <button class="btn btn-danger" id="confirm-yes-btn">✓ Sí</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Toast -->
  <div id="toast" class="toast hidden"></div>

  <script src="/js/app.js"></script>
  <script src="/js/dashboard.js"></script>
  <script src="/js/inventory.js"></script>
  <script src="/js/printers.js"></script>
  <script src="/js/clients.js"></script>
  <script src="/js/jobs.js"></script>
  <script src="/js/config-page.js"></script>
  <script>if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js');</script>
</body>
</html>
